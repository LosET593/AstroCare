<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora Vital: simulador de salud de astronautas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F4;--pn:#FFFFFF;--tx:#10242E;--mu:#52696F;--ln:#D3DEE2;--g:#1E8E63;--y:#9A6412;--r:#C93C3C;--ac:#1D5E80;--gb:#DDF3EA;--yb:#FBEFD3;--rb:#F9DEDE;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1B24;--pn:#14293A;--tx:#E6EFF2;--mu:#93AAB4;--ln:#24404F;--g:#4CD0A0;--y:#F2B63C;--r:#FF7A7A;--ac:#7CC4E8;--gb:#12392F;--yb:#3A2F12;--rb:#432024;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1B24;--pn:#14293A;--tx:#E6EFF2;--mu:#93AAB4;--ln:#24404F;--g:#4CD0A0;--y:#F2B63C;--r:#FF7A7A;--ac:#7CC4E8;--gb:#12392F;--yb:#3A2F12;--rb:#432024;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Barlow,system-ui,sans-serif}
#app{max-width:880px;margin:0 auto;padding:16px}
h1,h2,.nm,.big{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:2.4rem;line-height:1.05;margin:.2em 0}h2{font-size:1.3rem;margin:0 0 .3em}
p{margin:.4em 0;max-width:68ch}.mu{color:var(--mu)}
.top{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ln);padding-bottom:8px;margin-bottom:12px}
.top b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ac)}
.ban{padding:14px 16px;border-left:10px solid;border-radius:6px;margin-bottom:12px}
.ban .big{font-size:2rem;line-height:1.1}
.b0{background:var(--gb);border-color:var(--g)}.b1{background:var(--yb);border-color:var(--y)}.b2{background:var(--rb);border-color:var(--r)}
.ev{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.t{all:unset;box-sizing:border-box;cursor:pointer;background:var(--pn);border:2px solid var(--ln);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.t:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.t.on{border-color:var(--ac)}
.nm{font-size:1.1rem}.vl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2rem;text-align:right;line-height:1}
.vl small{font-size:.8rem;margin-left:3px;color:var(--mu);font-family:Barlow,sans-serif;font-weight:400}
.st{font-weight:600;font-size:.9rem}.l0 .st{color:var(--g)}.l1 .st{color:var(--y)}.l2 .st{color:var(--r)}
.l0 svg{color:var(--g)}.l1 svg{color:var(--y)}.l2 svg{color:var(--r)}
svg{grid-column:1/-1;width:100%;height:36px}
.det{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:12px 14px;margin:12px 0}
.det dl{margin:.4em 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.det dt{font-weight:600}.det dd{margin:0}
.act{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
button.a{font:600 1rem Barlow,sans-serif;text-align:left;cursor:pointer;background:var(--pn);color:var(--tx);border:2px solid var(--ln);border-radius:6px;padding:10px 12px}
button.a:hover:not(:disabled){border-color:var(--ac)}button.a:disabled{opacity:.45;cursor:not-allowed}
button.a span{display:block;font-weight:400;font-size:.88rem;color:var(--mu)}
button.go{font:700 1.05rem Barlow,sans-serif;background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:11px 20px;cursor:pointer;margin-top:8px}
.res{border-left:6px solid var(--ac);padding:8px 12px;background:var(--pn);border-radius:6px}
.pr{font-size:.9rem;color:var(--mu);margin-top:12px}
.fine{font-size:.82rem;color:var(--mu);margin-top:18px;border-top:1px solid var(--ln);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.ban{transition:background .4s,border-color .4s}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const LB=["Normal","Atención","Alerta"],SH=["●","▲","■"],CL=["g","y","r"];
const IND=[
{k:"fc",n:"Frecuencia cardíaca",u:"lpm",b:68,sd:4,dr:.05,dc:0,g:[60,100],y:[50,120],
why:"Sin gravedad la sangre se redistribuye hacia la cabeza y el corazón ajusta su ritmo. El estrés, la radiación y el ejercicio también la suben.",
guide:"Siéntate 10 min, respira lento (4 s inhalar, 6 s exhalar), evita cafeína y vuelve a medir.",
src:"AHA: ritmo en reposo del adulto 60–100 lpm."},
{k:"pa",n:"Presión sistólica",u:"mmHg",b:116,sd:5,dr:.08,dc:0,g:[90,129],y:[85,139],
why:"En microgravedad los líquidos suben al torso y la cabeza; el CO₂ alto de cabina y el estrés también elevan la presión.",
guide:"Reduce sodio en la comida, hidrátate, descansa y mide de nuevo en 30 min.",
src:"AHA/ACC 2017: <120 normal, ≥130 etapa 1, ≥140 etapa 2. El juego usa verde hasta 129 por simplificación."},
{k:"glu",n:"Glucosa",u:"mg/dL",b:88,sd:5,dr:0,dc:0,g:[70,99],y:[60,125],
why:"El estrés, el sueño corto y los cambios de dieta y de ejercicio alteran cómo el cuerpo maneja el azúcar.",
guide:"Si está baja, toma un snack con carbohidratos; si está alta, camina o ejercítate suave y revisa la dieta.",
src:"ADA: ayunas 70–99 normal, 100–125 prediabetes, <70 hipoglucemia."},
{k:"tmp",n:"Temperatura",u:"°C",b:36.7,sd:.2,dr:0,dc:1,g:[36.1,37.2],y:[35.5,37.9],
why:"Sin gravedad casi no hay convección natural: el aire caliente no sube y el cuerpo disipa peor el calor.",
guide:"Baja la temperatura de tu módulo, hidrátate, reduce la actividad y mide en 20 min.",
src:"CDC/NIH: normal ≈36.1–37.2 °C; fiebre desde 38 °C."},
{k:"sue",n:"Horas de sueño",u:"h",b:7.1,sd:.5,dr:-.03,dc:1,g:[7,9.5],y:[5.5,10.5],
why:"El ciclo luz-oscuridad se pierde (16 amaneceres al día en órbita), hay ruido y confinamiento. En la ISS se duerme cerca de 6 h.",
guide:"Cumple el horario fijo, baja la luz y las pantallas 1 h antes y reduce el ruido del módulo.",
src:"AASM/CDC: 7 h o más para adultos. Barger et al. 2014: ≈6 h en la ISS."},
{k:"ani",n:"Ánimo (1–10)",u:"/10",b:7.4,sd:.5,dr:-.045,dc:1,g:[6,10],y:[4,10],
why:"El aislamiento, el confinamiento y la distancia de la Tierra pesan en el ánimo a medida que pasan las semanas.",
guide:"Haz una videollamada con tu familia, una actividad que disfrutes y una conversación con tu compañero de misión.",
src:"Escala propia de autorreporte, sin umbral clínico. Sustituir por un instrumento validado (p. ej. POMS o PHQ-9)."}];
const EV=[
{t:"Día tranquilo",h:"Sin peligro",x:"Rutina normal a bordo.",s:{}},
{t:"Tormenta solar",h:"Radiación",x:"Subió la radiación y la tripulación se refugió en el módulo blindado.",s:{fc:12,sue:-1.2,ani:-.8,tmp:.2}},
{t:"Mensaje de casa con retraso",h:"Aislamiento y confinamiento",x:"Un mensaje familiar llegó con horas de demora.",s:{ani:-1.6,sue:-.6}},
{t:"Comunicación con 20 min de demora",h:"Distancia de la Tierra",x:"Nadie puede ayudar en tiempo real.",s:{ani:-.9,pa:8,fc:5}},
{t:"Sesión de ejercicio extenuante",h:"Campos gravitatorios",x:"Rutina de resistencia para frenar la pérdida de músculo y hueso.",s:{fc:15,pa:10,glu:-12,tmp:.4}},
{t:"CO₂ elevado en cabina",h:"Ambiente cerrado hostil",x:"El filtro de aire va con retraso.",s:{pa:10,sue:-1,fc:8,tmp:.3}}];
const N=30;
let S;
const g=()=>(Math.random()+Math.random()+Math.random()-1.5)/.87;
const lvl=(i,v)=>v>=i.g[0]&&v<=i.g[1]?0:v>=i.y[0]&&v<=i.y[1]?1:2;
const fmt=(i,v)=>i.dc?v.toFixed(1):Math.round(v);
function init(){S={day:0,score:0,health:100,win:5,hist:{},dev:{},base:{},cur:{},sel:null,done:false,msg:"",ev:null};
IND.forEach(i=>{S.hist[i.k]=[];S.dev[i.k]=0;S.base[i.k]=i.b});newDay()}
function newDay(){if(S.day>=N){S.day=N+1;return end()}
S.day++;S.done=false;S.msg="";
S.ev=Math.random()<.3?EV[0]:EV[1+Math.floor(Math.random()*5)];
IND.forEach(i=>{S.base[i.k]+=i.dr;S.dev[i.k]=S.dev[i.k]*.55+g()*i.sd+(S.ev.s[i.k]||0);
let v=S.base[i.k]+S.dev[i.k];if(i.k=="ani")v=Math.min(10,Math.max(1,v));if(i.k=="sue")v=Math.min(12,Math.max(2,v));
S.cur[i.k]=v;S.hist[i.k].push(v)});
S.sel=worst().k;render()}
function levels(){return IND.map(i=>lvl(i,S.cur[i.k]))}
function worst(){const L=levels();let m=0;L.forEach((l,j)=>{if(l>L[m])m=j});return IND[m]}
function need(){const L=levels(),r=L.filter(l=>l==2).length,y=L.filter(l=>l==1).length;
return r>0||y>=3?2:y>0?1:0}
function spark(i){const h=S.hist[i.k].slice(-12),lo=Math.min(...h,i.g[0]),hi=Math.max(...h,i.g[1]),W=200,H=36,
Y=v=>H-2-(v-lo)/(hi-lo||1)*(H-4),X=j=>2+j*(W-4)/Math.max(h.length-1,1);
return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="${Y(i.g[1])}" width="${W}" height="${Math.max(Y(i.g[0])-Y(i.g[1]),1)}" fill="currentColor" opacity=".14"/><polyline fill="none" stroke="currentColor" stroke-width="2" points="${h.map((v,j)=>X(j)+","+Y(v)).join(" ")}"/></svg>`}
function pick(k){S.sel=k;render()}
function act(a){const n=need();let d=0,h=0,m="";
const wi=worst();
if(a==2){if(S.win<1)return;S.win--;IND.forEach(i=>{S.dev[i.k]*=.15;S.base[i.k]+=(i.b-S.base[i.k])*.8});
if(n==2){d=10;m="Escalaste a tiempo. El cirujano de vuelo en Tierra revisó los datos y dio instrucciones. Se gastó una ventana de comunicación."}
else{d=-5;m="Escalaste sin necesidad y gastaste una ventana de comunicación que podrías necesitar después."}}
if(a==1){IND.forEach((i,j)=>{const l=lvl(i,S.cur[i.k]);if(l==1){S.dev[i.k]*=.3;S.base[i.k]+=(i.b-S.base[i.k])*.5}else if(l==2){S.dev[i.k]*=.6}});
if(n==1){d=10;m="Buena decisión: aplicaste la guía de acción y los indicadores amarillos mejoran. Guía aplicada: "+wi.guide}
else if(n==0){d=2;m="Todo estaba normal. No hacía falta, pero cuidar los hábitos nunca sobra."}
else{d=-10;h=-8;m="La guía no alcanzaba: había una alerta roja o tres alertas amarillas a la vez. Debías escalar al cirujano de vuelo."}}
if(a==0){if(n==0){d=10;m="Correcto: todo normal, se continúa con la rutina."}
else if(n==1){d=-5;h=-4;m="Seguir sin actuar dejó que los indicadores amarillos empeoren."}
else{d=-15;h=-12;m="Ignoraste una situación que requería escalar. La salud de la tripulación se deteriora."}}
S.score+=d;S.health=Math.max(0,Math.min(100,S.health+h));
S.msg=`<b>${d>=0?"+":""}${d} puntos${h?" · salud "+h:""}.</b> ${m}`;S.done=true;render()}
function intro(){$("#app").innerHTML=`<h1>Bitácora Vital</h1><p class="mu">Simulador de monitoreo de salud para una tripulación en tránsito a Marte. Proyecto para el NASA Space Apps Challenge 2026.</p>
<div class="det"><h2>Tu rol</h2><p>Eres el sistema de apoyo a la salud de la nave. Cada día (30 en total) lees seis indicadores del Cdte. Rivera, un astronauta sintético, y decides qué hacer.</p>
<p><b>Verde</b> (●) sigue con la rutina. <b>Amarillo</b> (▲) aplica la guía de acción. <b>Rojo</b> (■) escala al cirujano de vuelo en Tierra, pero solo tienes <b>5 ventanas de comunicación</b> para toda la misión.</p>
<p>Los cinco peligros del espacio (radiación, aislamiento, distancia, gravedad y ambiente cerrado) generan eventos que mueven los números. Que no se te caiga la salud de la misión.</p></div>
<button class="go" onclick="init()">Iniciar misión</button>
<p class="fine">Herramienta educativa con datos sintéticos. No es diagnóstico médico: es apoyo a la evaluación. Los umbrales provienen de las fuentes citadas en cada indicador y deben verificarse antes de presentar.</p>`}
function end(){const ab=S.health<=0,r=ab?"Misión abortada":S.score>=240?"Cirujano de vuelo estelar":S.score>=150?"Oficial médico competente":"Cadete en práctica";
$("#app").innerHTML=`<h1>${r}</h1><div class="ban b${ab?2:S.health>60?0:1}"><div class="big">${S.score} puntos</div><div>${ab?"La salud de la tripulación llegó a 0 el día "+S.day+".":"Misión completada. Salud final: "+S.health+"/100. Ventanas sin usar: "+S.win+"."}</div></div>
<p>Pregunta para la presentación: ¿qué indicador fue el primero en salir de rango en tu partida? En una misión larga, sueño y ánimo suelen bajar primero por el aislamiento y los ciclos de luz alterados.</p>
<button class="go" onclick="init()">Jugar de nuevo</button>`}
function render(){if(S.health<=0||(S.day>N&&S.done))return end();
const L=levels(),n=Math.max(...L),i=IND.find(x=>x.k==S.sel),ln=need(),
st=["Tripulación estable","Atención: revisa los indicadores amarillos","Alerta: indicador fuera de rango"][n];
const adv=[["Rutina","Todo normal"],["Guía de acción","Aplica el consejo al indicador amarillo"],["Escalar al cirujano","Usa 1 ventana de comunicación"]];
$("#app").innerHTML=`<div class="top"><b>Día ${Math.min(S.day,N)} de ${N} · Cdte. Rivera (sintético)</b>
<span>Puntos <b>${S.score}</b></span><span>Salud <span class="bar"><i style="width:${S.health}%"></i></span> ${S.health}</span><span>Ventanas <b>${S.win}</b></span></div>
<div class="ban b${n}"><div class="big">${SH[n]} ${st}</div></div>
<div class="ev"><b>${S.ev.t}</b> <span class="mu">· ${S.ev.h}</span><br>${S.ev.x}</div>
<div class="grid">${IND.map((x,j)=>`<button class="t l${L[j]}${S.sel==x.k?" on":""}" onclick="pick('${x.k}')"><span class="nm">${x.n}</span><span class="vl">${fmt(x,S.cur[x.k])}<small>${x.u}</small></span><span class="st">${SH[L[j]]} ${LB[L[j]]}</span><span></span>${spark(x)}</button>`).join("")}</div>
<div class="det"><h2>${i.n}</h2><dl><dt>Por qué cambia</dt><dd>${i.why}</dd><dt>Rango normal</dt><dd>${i.g[0]}–${i.g[1]} ${i.u}</dd><dt>Guía de acción</dt><dd>${i.guide}</dd><dt>Fuente</dt><dd>${i.src}</dd></dl></div>
${S.done?`<div class="res">${S.msg}</div><button class="go" onclick="newDay()">${S.day>=N?"Ver resultado":"Siguiente día"}</button>`:
`<h2>¿Qué haces hoy?</h2><div class="act">${adv.map((a,j)=>`<button class="a" ${j==2&&S.win<1?"disabled":""} onclick="act(${j})">${a[0]}<span>${a[1]}</span></button>`).join("")}</div>`}
<p class="pr">Protocolo: alerta roja en cualquier indicador, o tres o más alertas amarillas a la vez, se escala. Una o dos amarillas, guía de acción. Todo verde, rutina.</p>
<p class="fine">Datos sintéticos. Herramienta educativa, no diagnóstico médico.</p>`;
}
intro();
</script></body></html>
