<style>

radial-gradient(1.2px 1.2px at 12% 18%,#fff9,transparent),radial-gradient(1px 1px at 34% 72%,#fff7,transparent),radial-gradient(1.4px 1.4px at 58% 30%,#fffa,transparent),radial-gradient(1px 1px at 79% 62%,#fff8,transparent),radial-gradient(1.2px 1.2px at 91% 14%,#fff9,transparent),radial-gradient(1px 1px at 46% 90%,#fff6,transparent),var(--bg);

.ban{padding:14px 18px;border:1px solid var(--bc);border-left:6px solid var(--bc);border-radius:14px;margin-bottom:10px;box-shadow:0 0 28px -10px var(--bc)}.ban .big{font-size:1.8rem;line-height:1.1;letter-spacing:.02em}

.t:hover{transform:translateY(-2px);box-shadow:0 8px 22px -10px var(--c)}
.t.on{border-left-color:var(--ac);border-right-color:var(--ac);border-bottom-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 24px -8px var(--ac)}

button:focus-visible,.t:focus-visible,.hs:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.nm{font-size:1.1rem;letter-spacing:.02em}.vl{font:700 2.1rem/1 "Barlow Condensed",sans-serif;text-align:right;color:var(--c);text-shadow:0 0 14px var(--c)}.vl small{font:400 .8rem Barlow;color:var(--mu);margin-left:3px;text-shadow:none}

.a:hover:not(:disabled){border-color:var(--ac);box-shadow:0 0 18px -8px var(--ac)}.a:disabled{opacity:.4;cursor:not-allowed}.a.sel{border-color:var(--g);background:var(--gb);box-shadow:0 0 18px -8px var(--g)}.a span{display:block;font-weight:400;font-size:.85rem;color:var(--mu)}
.go{font:700 1.05rem Barlow,sans-serif;letter-spacing:.02em;background:linear-gradient(135deg,var(--ac),#4aa0d4);color:#06141f;border:0;border-radius:12px;padding:11px 24px;cursor:pointer;margin:8px 0;box-shadow:0 6px 22px -6px var(--ac)}.go:hover:not(:disabled){filter:brightness(1.1)}.go:disabled{opacity:.6}
.fig{width:100%;max-width:230px;margin:0 auto;display:block}.hs{cursor:pointer;color:var(--c)}
@keyframes pu{50%{opacity:.35}}.pul{animation:pu 1s infinite}
@keyframes sw{from{transform:translateY(8px)}to{transform:translateY(290px)}}.sweep{animation:sw .9s linear;filter:drop-shadow(0 0 6px #7CC4E8)}
@media(prefers-reduced-motion:reduce){.pul,.sweep{animation:none}.t{transition:none}}
.fine{font-size:.82rem;color:var(--mu);margin-top:18px;border-top:1px solid var(--ln);padding-top:10px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const LB=["Normal","Atención","Alerta"],SH=["●","▲","■"],GL=["✓","!","✕"];
const IND=[
{k:"fc",n:"Frecuencia cardíaca",u:"lpm",b:66,sd:3,fl:5,K:.25,dc:0,g:[60,100],y:[50,120],
why:"Sin gravedad la sangre se redistribuye hacia la cabeza y el corazón ajusta su ritmo. El estrés, la radiación y el ejercicio también la suben.",
guide:"Siéntate 10 min, respira lento (4 s inhalar, 6 s exhalar), evita cafeína y vuelve a medir.",src:"AHA: ritmo en reposo del adulto 60–100 lpm."},
{k:"pa",n:"Presión sistólica",u:"mmHg",b:114,sd:4,fl:6,K:.4,dc:0,g:[90,129],y:[85,139],
why:"En microgravedad los líquidos suben al torso y la cabeza; el CO₂ alto de cabina y el estrés también elevan la presión.",
guide:"Reduce sodio, hidrátate, descansa y mide de nuevo en 30 min.",src:"AHA/ACC 2017: <120 normal, ≥130 etapa 1, ≥140 etapa 2. Verde hasta 129 por simplificación."},
{k:"glu",n:"Glucosa",u:"mg/dL",b:88,sd:4,fl:0,K:.5,dc:0,g:[70,99],y:[60,125],
why:"El estrés, el sueño corto y los cambios de dieta y ejercicio alteran cómo el cuerpo maneja el azúcar.",
guide:"Si está baja, toma un snack con carbohidratos; si está alta, camina suave y revisa la dieta.",src:"ADA: ayunas 70–99 normal, 100–125 prediabetes, <70 hipoglucemia."},
{k:"tmp",n:"Temperatura",u:"°C",b:36.6,sd:.15,fl:0,K:0,dc:1,g:[36.1,37.2],y:[35.5,37.9],
why:"Sin gravedad casi no hay convección natural: el aire caliente no sube y el cuerpo disipa peor el calor.",
guide:"Baja la temperatura de tu módulo, hidrátate, reduce la actividad y mide en 20 min.",src:"CDC/NIH: normal ≈36.1–37.2 °C; fiebre desde 38 °C."},
{k:"sue",n:"Horas de sueño",u:"h",dc:1,K:0,g:[7,9.5],y:[5.5,10.5],
why:"El ciclo luz-oscuridad se pierde (16 amaneceres al día en órbita), hay ruido y confinamiento. En la ISS se duerme cerca de 6 h.",
guide:"Cumple un horario fijo, baja la luz y las pantallas 1 h antes y reduce el ruido del módulo.",src:"AASM/CDC: 7 h o más en adultos. Barger et al. 2014: ≈6 h en la ISS."},
{k:"ani",n:"Ánimo (1–10)",u:"/10",b:7.8,sd:.4,fl:0,K:-.08,dc:1,g:[6,10],y:[4,10],
why:"El aislamiento, el confinamiento y la distancia de la Tierra pesan en el ánimo con el paso de las semanas.",
guide:"Videollamada con tu familia, una actividad que disfrutes y una conversación con tu compañero de misión.",src:"Escala propia de autorreporte, sin umbral clínico. Sustituir por un instrumento validado (POMS o PHQ-9)."}];
const POS={tmp:[100,30],ani:[100,54],sue:[155,40],fc:[88,100],pa:[45,112],glu:[100,150]};
const EV=[
{t:"Día tranquilo",h:"Sin peligro",x:"Rutina normal a bordo.",s:{}},
{t:"Tormenta solar",h:"Radiación",x:"Subió la radiación y la tripulación se refugió en el módulo blindado.",s:{fc:12,sue:-1.2,ani:-.8,tmp:.2}},
{t:"Mensaje de casa con retraso",h:"Aislamiento y confinamiento",x:"Un mensaje familiar llegó con horas de demora.",s:{ani:-1.6,sue:-.6}},
{t:"Comunicación con 20 min de demora",h:"Distancia de la Tierra",x:"Nadie puede ayudar en tiempo real.",s:{ani:-.9,pa:8,fc:5}},
{t:"Sesión de ejercicio extenuante",h:"Campos gravitatorios",x:"Rutina de resistencia para frenar la pérdida de músculo y hueso.",s:{fc:15,pa:10,glu:-12,tmp:.4}},
{t:"CO₂ elevado en cabina",h:"Ambiente cerrado hostil",x:"El filtro de aire va con retraso.",s:{pa:10,sue:-1,fc:8,tmp:.3}}];
const PL=[{h:5.5,t:"Misión intensa",p:5},{h:7.5,t:"Descanso normal",p:2},{h:9,t:"Recuperación",p:0}];
const N=30,NEED=7.5,DEC=.9;
const g=()=>(Math.random()+Math.random()+Math.random()-1.5)/.87,cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const lvl=(i,v)=>v>=i.g[0]&&v<=i.g[1]?0:v>=i.y[0]&&v<=i.y[1]?1:2;
const fmt=(i,v)=>i.dc?v.toFixed(1):Math.round(v);
let S;
function init(){S={day:0,score:0,health:100,win:5,debt:0,adj:{},hist:{},cur:{},plan:1,sleepPlan:7.5,sel:"sue",scanned:false,scanning:false,done:false,msg:"",ev:null,first:null};
IND.forEach(i=>{S.adj[i.k]=0;S.hist[i.k]=[]});newDay()}
function newDay(){if(S.day>=N){S.day=N+1;return end()}
S.day++;S.scanned=S.scanning=S.done=false;S.msg="";
S.ev=Math.random()<.3?EV[0]:EV[1+Math.floor(Math.random()*5)];
const sl=cl(S.sleepPlan+g()*.4+(S.ev.s.sue||0),2,12);
S.debt=S.debt*DEC+Math.max(0,NEED-sl);
const fl=Math.exp(-S.day/6),iso=S.day/30;
IND.forEach(i=>{let v;
if(i.k=="sue")v=sl;else{S.adj[i.k]=S.adj[i.k]*.55+g()*i.sd+(S.ev.s[i.k]||0);
v=i.b+i.fl*fl+i.K*S.debt+S.adj[i.k]-(i.k=="ani"?.9*iso:0);if(i.k=="ani")v=cl(v,1,10)}
S.cur[i.k]=v;S.hist[i.k].push(v)});
if(!S.first){const w=IND.find(i=>lvl(i,S.cur[i.k])>0);if(w)S.first={n:w.n,d:S.day}}
S.sel=worst().k;render()}
const levels=()=>IND.map(i=>lvl(i,S.cur[i.k]));
function worst(){const L=levels();let m=0;L.forEach((l,j)=>{if(l>L[m])m=j});return IND[m]}
function need(){const L=levels(),r=L.filter(l=>l==2).length,y=L.filter(l=>l==1).length;return r>0||y>=3?2:y>0?1:0}
/* Radar predictivo: tendencia amortiguada + efecto de la deuda de sueño (mismo modelo que la app Flutter) */
function damped(y,H){const n=y.length,xm=(n-1)/2,ym=y.reduce((a,b)=>a+b)/n;let nu=0,de=0;
y.forEach((v,i)=>{nu+=(i-xm)*(v-ym);de+=(i-xm)**2});let st=de?nu/de:0,ac=y[n-1];const o=[];
for(let j=0;j<H;j++){st*=.85;ac+=st;o.push(ac)}return o}
function project(H){const hs=S.hist,len=hs.sue.length;if(len<4)return null;
let d=0;const ds=hs.sue.map(s=>d=d*DEC+Math.max(0,NEED-s)),st=len-Math.min(8,len);
const sf=damped(hs.sue.slice(st),H).map(v=>cl(v,2,12));let dd=ds[len-1];const fd=sf.map(s=>dd=dd*DEC+Math.max(0,NEED-s)),P={};
IND.forEach(i=>{let f;if(i.k=="sue")f=sf;else if(!i.K)f=damped(hs[i.k].slice(st),H);
else{const r=hs[i.k].slice(st).map((v,j)=>v-i.K*ds[st+j]);f=damped(r,H).map((v,j)=>v+i.K*fd[j])}
P[i.k]=i.k=="ani"?f.map(v=>cl(v,1,10)):f});return P}
function radar(){const P=project(7);if(!P)return null;let al=0,at=0,wa=[],wt=[];
IND.forEach(i=>{const f=P[i.k],l0=lvl(i,S.cur[i.k]);
const a=l0<2?f.findIndex(v=>lvl(i,v)==2)+1:0,t=l0==0?f.findIndex(v=>lvl(i,v)>0)+1:0;
if(a){if(!al||a<al){al=a;wa=[i.n]}else if(a==al)wa.push(i.n)}
if(t){if(!at||t<at){at=t;wt=[i.n]}else if(t==at)wt.push(i.n)}});return{P,al,wa,at,wt}}
function spark(i,p){const h=S.hist[i.k].slice(-12),a=[...h,...p],lo=Math.min(...a,i.g[0]),hi=Math.max(...a,i.g[1]),W=200,H=34,n=a.length,
Y=v=>H-2-(v-lo)/(hi-lo||1)*(H-4),X=j=>2+j*(W-4)/Math.max(n-1,1),pt=(r,o)=>r.map((v,j)=>X(j+o)+","+Y(v)).join(" ");
return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="${Y(i.g[1])}" width="${W}" height="${Math.max(Y(i.g[0])-Y(i.g[1]),1)}" fill="currentColor" opacity=".14"/><polyline fill="none" stroke="currentColor" stroke-width="2" points="${pt(h,0)}"/>${p.length?`<polyline fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7" points="${pt([h[h.length-1],...p],h.length-1)}"/>`:""}</svg>`}
function pick(k){S.sel=k;render()}
function setPlan(j){S.plan=j;S.sleepPlan=PL[j].h;render()}
function scan(){S.scanning=true;render();setTimeout(()=>{S.scanned=true;S.scanning=false;render()},900)}
function act(a){const n=need(),wi=worst();let d=PL[S.plan].p,h=0,m="";
if(a==2){if(S.win<1)return;S.win--;S.debt*=.3;IND.forEach(i=>S.adj[i.k]*=.15);
if(n==2){d+=10;m="Escalaste a tiempo. El cirujano de vuelo en Tierra revisó los datos y dio instrucciones. Se gastó una ventana de comunicación."}
else{d-=5;m="Escalaste sin necesidad y gastaste una ventana de comunicación que podrías necesitar después."}}
if(a==1){IND.forEach(i=>{const l=lvl(i,S.cur[i.k]);if(l==1)S.adj[i.k]*=.3;else if(l==2)S.adj[i.k]*=.6});
if(lvl(IND[4],S.cur.sue)||lvl(IND[5],S.cur.ani))S.debt*=.8;
if(n==1){d+=10;m="Buena decisión: aplicaste la guía de acción. "+wi.guide}
else if(n==0){d+=2;m="Todo estaba normal. No hacía falta, pero cuidar los hábitos nunca sobra."}
else{d-=10;h=-8;m="La guía no alcanzaba: había una alerta roja o tres amarillas a la vez. Debías escalar al cirujano de vuelo."}}
if(a==0){if(n==0){d+=10;m="Correcto: todo normal, se continúa con la rutina."}
else if(n==1){d-=5;h=-4;m="Seguir sin actuar dejó que los indicadores amarillos empeoren."}
else{d-=15;h=-12;m="Ignoraste una situación que requería escalar. La salud de la tripulación se deteriora."}}
S.score+=d;S.health=cl(S.health+h,0,100);
S.msg=`<b>${d>=0?"+":""}${d} puntos${h?" · salud "+h:""}.</b> ${m} Dormirás ${PL[S.plan].h} h esta noche.`;S.done=true;render()}
function fig(L,sc){return `<svg class="fig" viewBox="0 0 200 300" role="group" aria-label="Figura humana con sensores"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35597a"/><stop offset="1" stop-color="#16293a"/></linearGradient><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CC4E8" stop-opacity=".55"/><stop offset="1" stop-color="#0b1824"/></linearGradient></defs><g stroke="#4f7391" stroke-width="15" stroke-linecap="round" fill="none"><path d="M70 86L44 150M130 86L156 150M89 178L83 266M111 178L117 266"/></g><g stroke="url(#sg)" stroke-width="11" stroke-linecap="round" fill="none"><path d="M70 86L44 150M130 86L156 150M89 178L83 266M111 178L117 266"/></g><rect x="68" y="72" width="64" height="106" rx="20" fill="url(#sg)" stroke="#6f97b5" stroke-width="2"/><rect x="86" y="118" width="28" height="18" rx="4" fill="none" stroke="#6f97b5" stroke-opacity=".6"/><circle cx="100" cy="42" r="26" fill="url(#sg)" stroke="#6f97b5" stroke-width="2"/><ellipse cx="100" cy="44" rx="18" ry="15" fill="url(#vg)" stroke="#9fc6df" stroke-opacity=".6"/>`+
IND.map((i,j)=>{const[x,y]=POS[i.k],c=sc?L[j]:3,lab=(i.k=="pa"||i.k=="sue")?[x,y+23,"middle"]:[x+13,y+4,"start"];
return `<g class="hs c${c}${sc||S.scanning?"":" pul"}" tabindex="0" role="button" aria-label="${i.n}" onclick="pick('${i.k}')" onkeydown="if(event.key=='Enter')pick('${i.k}')"><circle cx="${x}" cy="${y}" r="15" fill="currentColor" opacity=".18"/><circle cx="${x}" cy="${y}" r="9" fill="currentColor" stroke="var(--pn)" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pn)">${sc?GL[c]:"?"}</text><text x="${lab[0]}" y="${lab[1]}" text-anchor="${lab[2]}" font-size="11" fill="var(--tx)">${{tmp:"T°",ani:"Ánimo",sue:"Sueño",fc:"FC",pa:"PA",glu:"Glu"}[i.k]}</text></g>`}).join("")+(S.scanning?`<rect class="sweep" x="25" y="0" width="150" height="4" rx="2" fill="#7CC4E8"/>`:"")+`</svg>`}
function intro(){$("#app").innerHTML=`<svg class="orb" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="mg" cx=".35" cy=".35"><stop offset="0" stop-color="#f0a070"/><stop offset="1" stop-color="#8a3a22"/></radialGradient></defs><ellipse cx="60" cy="60" rx="56" ry="20" fill="none" stroke="#7CC4E8" stroke-opacity=".5" transform="rotate(-20 60 60)"/><circle cx="60" cy="60" r="26" fill="url(#mg)"/><circle cx="7" cy="79" r="4" fill="#E8F1F5"/></svg><div class="eyebrow">NASA Space Apps Challenge 2026 · Reto 04</div><h1>Bitácora Vital</h1><p class="mu">Juego de monitoreo de salud para una tripulación en tránsito a Marte. NASA Space Apps Challenge 2026: monitoreo de salud de astronautas.</p>
<div class="box"><h2>Tu rol</h2><p>Eres el sistema de salud de la nave. Cada día (30 en total): <b>1)</b> escaneas al Cdte. Rivera (astronauta sintético) con los electrodos, <b>2)</b> lees seis indicadores y el radar predictivo, <b>3)</b> eliges su plan de descanso y <b>4)</b> decides qué hacer.</p>
<p><b>Verde</b> (✓) rutina. <b>Amarillo</b> (!) guía de acción. <b>Rojo</b> (✕), o tres amarillos a la vez: escalar al cirujano de vuelo en Tierra. Solo tienes <b>5 ventanas de comunicación</b> en toda la misión.</p>
<p>Dormir poco rinde más tareas hoy, pero acumula deuda de sueño y el cuerpo lo paga después: sube la frecuencia cardíaca, la presión y la glucosa, y baja el ánimo. Toca la figura humana para ver cada indicador.</p></div>
<div class="box"><h2>Preguntas del reto</h2><p><b>¿Qué cambia primero?</b> Sueño y ánimo, por aislamiento, ciclos de luz alterados y deuda de sueño. <b>¿Qué hace el astronauta con una alerta roja?</b> Escala al cirujano de vuelo mientras aplica reposo e hidratación. <b>¿De dónde sale cada umbral?</b> De la fuente citada en cada indicador.</p></div>
<button class="go" onclick="init()">Iniciar misión</button>
<p class="fine">Herramienta educativa con datos sintéticos. No es diagnóstico médico: es apoyo a la evaluación. Los umbrales y el modelo de proyección son simplificados y deben verificarse con la literatura antes de presentar.</p>`}
function end(){const ab=S.health<=0,r=ab?"Misión abortada":S.score>=300?"Cirujano de vuelo estelar":S.score>=190?"Oficial médico competente":"Cadete en práctica";
$("#app").innerHTML=`<h1>${r}</h1><div class="ban b${ab?2:S.health>60?0:1}"><div class="big">${S.score} puntos</div><div>${ab?"La salud de la tripulación llegó a 0 el día "+S.day+".":"Misión completada. Salud final: "+S.health+"/100. Ventanas sin usar: "+S.win+"."}</div></div>
<p>${S.first?`En esta partida, el primer indicador en salir de rango fue <b>${S.first.n}</b> el día ${S.first.d}.`:"Ningún indicador salió de rango."} En misiones largas suelen ceder primero el sueño y el ánimo.</p>
<button class="go" onclick="init()">Jugar de nuevo</button>`}
function render(){if(S.health<=0)return end();
const sc=S.scanned,L=levels(),n=sc?Math.max(...L):3,i=IND.find(x=>x.k==S.sel),R=sc?radar():null,P=R?R.P:null,
st=["Tripulación estable","Atención: revisa los indicadores amarillos","Alerta: indicador fuera de rango","Sin datos: escanea al tripulante"][n];
const adv=[["Rutina","Todo normal"],["Guía de acción","Aplica el consejo al indicador amarillo"],["Escalar al cirujano","Usa 1 ventana de comunicación"]];
let rd="";if(sc){if(!R)rd=`<div class="box"><b>Radar predictivo:</b> faltan lecturas (${S.day}/4).</div>`;
else{const lv=R.al?2:R.at?1:0;rd=`<div class="ban b${lv}"><b>Radar predictivo:</b> ${R.al?`si el patrón continúa, alerta en ~${R.al} días (${R.wa.join(", ")})`:R.at?`si el patrón continúa, atención en ~${R.at} días (${R.wt.join(", ")})`:"sin cambios de semáforo previstos en 7 días"}.<br><small class="mu">Líneas punteadas = proyección: tendencia amortiguada más efecto de la deuda de sueño. Modelo explicable, no diagnóstico.</small></div>`}}
const ctl=!sc?`<button class="go" ${S.scanning?"disabled":""} onclick="scan()">${S.scanning?"Leyendo electrodos…":"Escanear con electrodos"}</button>`:
S.done?`<div class="box">${S.msg}</div><button class="go" onclick="newDay()">${S.day>=N?"Ver resultado":"Siguiente día"}</button>`:
`<h2>Plan de descanso de esta noche</h2><div class="act">${PL.map((p,j)=>`<button class="a${S.plan==j?" sel":""}" onclick="setPlan(${j})">${p.t} · ${p.h} h<span>Tareas de misión +${p.p}</span></button>`).join("")}</div>
<h2>¿Qué haces hoy?</h2><div class="act">${adv.map((a,j)=>`<button class="a" ${j==2&&S.win<1?"disabled":""} onclick="act(${j})">${a[0]}<span>${a[1]}</span></button>`).join("")}</div>`;
$("#app").innerHTML=`<div class="top"><b>Día ${Math.min(S.day,N)} de ${N} · Cdte. Rivera (sintético)</b><span>Puntos <b>${S.score}</b></span><span>Salud <span class="bar"><i style="width:${S.health}%"></i></span> ${S.health}</span><span>Ventanas <b>${S.win}</b></span></div><div class="prog"><i style="width:${Math.min(S.day,N)/N*100}%"></i></div>
<div class="ban b${n}"><div class="big">${sc?SH[n]+" ":""}${st}</div></div>
<div class="box"><span class="tag">${S.ev.h}</span><b>${S.ev.t}</b><br>${S.ev.x}</div>
<div class="main"><div>${fig(L,sc)}<p class="mu" style="text-align:center;font-size:.85rem">Toca un sensor</p></div>
<div class="grid">${IND.map((x,j)=>sc?`<button class="t c${L[j]}${S.sel==x.k?" on":""}" onclick="pick('${x.k}')"><span class="nm">${x.n}</span><span class="vl">${fmt(x,S.cur[x.k])}<small>${x.u}</small></span><span class="st">${SH[L[j]]} ${LB[L[j]]}</span><span></span>${spark(x,P?P[x.k]:[])}</button>`:`<button class="t c3${S.sel==x.k?" on":""}" onclick="pick('${x.k}')"><span class="nm">${x.n}</span><span class="vl">—<small>${x.u}</small></span><span class="st">Sin escanear</span><span></span></button>`).join("")}</div></div>
<div class="box" style="margin-top:10px"><h2>${i.n}</h2><dl><dt>Por qué cambia</dt><dd>${i.why}</dd><dt>Rango normal</dt><dd>${i.g[0]}–${i.g[1]} ${i.u}</dd><dt>Guía de acción</dt><dd>${i.guide}</dd><dt>Fuente</dt><dd>${i.src}</dd></dl></div>
${rd}${ctl}
<p class="fine">Protocolo: alerta roja, o tres o más amarillas a la vez, se escala. Una o dos amarillas, guía de acción. Todo verde, rutina. Datos sintéticos; herramienta educativa, no diagnóstico médico.</p>`}
intro();
</script></body></html>
